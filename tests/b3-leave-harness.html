<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave interaction harness</title>
  <div id="root"></div>
  <script type="module">
    import React, { useState } from 'react'
    import { createRoot } from 'react-dom/client'
    import { LeavePage } from '/src/pages/Staffing.jsx'
    import '/src/styles.css'
    import '/src/foundation.css'

    function Fixture() {
      const [role, setRole] = useState(new URLSearchParams(location.search).get('role') || 'staff')
      const [account, setAccount] = useState('A')
      window.leaveFixture = { setRole, setAccount, feedback: window.leaveFixture?.feedback || [] }
      return React.createElement(LeavePage, {role, store: {
        state: { branches: [] }, session: { serverUserId: `synthetic-${account}`, userId: account, role, active: true },
        getAuthGeneration: () => account, toast: (...args) => window.leaveFixture.feedback.push(args),
      }})
    }
    createRoot(document.getElementById('root')).render(React.createElement(Fixture))
  </script>
</html>
