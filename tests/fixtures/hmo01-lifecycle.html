<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMO-01 synthetic lifecycle fixture</title></head><body><div id="root"></div><script type="module">
import React,{useState} from 'react'
import {createRoot} from 'react-dom/client'
import {HmoPage} from '/src/pages/Hmo.jsx'
import {HMO_PROVIDERS} from '/src/phase3-contracts.js'
import '/src/styles.css'
import '/src/foundation.css'
import '/src/polish.css'
const cases=['a','b'].map((id,index)=>({id:`case-${id}`,server:true,revision:1,submissionCycle:index?0:1,status:index?'Missing Requirements':'Pending',patientId:`patient-${id}`,patientPublicId:`patient-${id}`,patientName:`Synthetic Patient ${id.toUpperCase()}`,branchId:'b1',branch:'Synthetic branch',visitId:`visit-${id}`,clinicDate:'2026-11-06',providerName:'Synthetic provider',requirements:[{id:`req-${id}`,ruleId:'hmo-card',label:'HMO Card',state:'Missing'}],events:[],contacts:[],responses:[],submittedAt:index?null:'2026-11-06T08:00:00+08:00',followUpDueAt:'2026-11-07T08:00:00+08:00'}))
const memberships=new Map(['a','b'].map(id=>[`patient-${id}`,{patient:{id:`patient-${id}`},active:{id:`membership-${id}`,provider_name:'Synthetic provider',member_number:`PRIVATE-${id.toUpperCase()}`},history:[]}]))
window.hmo01={requests:[],holdLoad:false,loads:[],holdCommand:false,release:null,failCommand:false,failRefresh:false}
window.fetch=async (url,options={})=>{
 const path=new URL(url,location.href).pathname
 if(path==='/sanctum/csrf-cookie')return new Response(null,{status:204})
 if(options.method!=='POST'&&path.startsWith('/api/patients/')){
  const id=decodeURIComponent(path.split('/')[3]),payload=structuredClone(memberships.get(id))
  if(window.hmo01.holdLoad)await new Promise(resolve=>window.hmo01.loads.push({id,release:resolve}))
  return Response.json({data:payload})
 }
 window.hmo01.requests.push({path,body:JSON.parse(options.body||'{}'),key:options.headers?.['Idempotency-Key']})
 if(window.hmo01.holdCommand)await new Promise(resolve=>{window.hmo01.release=resolve})
 if(window.hmo01.failCommand)return Response.json({message:'Synthetic recoverable command refusal'},{status:500})
 if(path.includes('/hmo-membership')){
  const id=path.split('/')[3].replace('visit-','patient-'),old=memberships.get(id),body=JSON.parse(options.body)
  const next={...old,active:path.endsWith('/end')?null:{id:`replacement-${id}`,provider_name:body.provider_name,member_number:body.member_number}}
  memberships.set(id,next);return Response.json({data:next})
 }
 const item=cases.find(row=>path.includes(row.id))
 if(item)item.revision++
 return Response.json({data:{id:item?.id||'case-a'}})
}
function Fixture(){
 const [role,setRole]=useState('staff'),[version,setVersion]=useState(0),[context,setContext]=useState(null)
 window.hmo01.setRole=setRole;window.hmo01.setContext=setContext
 window.hmo01.bumpCase=id=>{cases.find(row=>row.id===id).revision++;setVersion(v=>v+1)}
 const person={id:'person'},user={id:'user',personId:'person',role:role==='owner'?'Owner / Admin':'Staff',status:'Active',permissions:role==='owner'?['all']:['hmo'],branchId:'b1'}
 const session={serverUserId:'server-user',userId:'user',role,active:true,branchId:'b1',branchScopes:['b1']}
 const history={id:'historical',legacy:true,patientId:'patient-a',branchId:'b1',providerId:HMO_PROVIDERS[0].id,status:'Approved',requirements:[]}
 const state={persons:[person],users:[user],staff:[{userId:'user',personId:'person',branchId:'b1'}],dentists:[],patients:[{id:'patient-a',name:'Synthetic Patient A'},{id:'patient-b',name:'Synthetic Patient B'}],branches:[{id:'b1',name:'Synthetic branch'}],hmo:[...cases.map(row=>structuredClone(row)),history],claimDecisions:[],appointments:[],treatments:[],queue:[],visits:['a','b'].map(id=>({id:`visit-${id}`,server:true,branchId:'b1',patientPublicId:`patient-${id}`,patientName:`Synthetic Patient ${id.toUpperCase()}`,patientCode:id,clinicDate:'2026-11-06'})),clock:{timestamp:'2026-11-06T10:00:00+08:00'}}
 const store={state,session,toast(){},appointmentFlow:{refresh:async()=>{
  if(window.hmo01.failRefresh)return{ok:false}
  setVersion(v=>v+1)
  return{ok:true}
 }}}
 return React.createElement(HmoPage,{role,store,context,activeBranch:'Synthetic branch'})
}
createRoot(document.getElementById('root')).render(React.createElement(Fixture))
</script></body></html>
