<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic notification history</title></head><body><div id="root"></div><script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import {Shell} from '/src/layout.jsx'
import '/src/styles.css'
import '/src/foundation.css'
import '/src/polish.css'
const session={serverUserId:'synthetic-account',role:'staff',active:true,userId:'u1',branchId:'b1'}
const state={persons:[{id:'p1'}],users:[{id:'u1',personId:'p1',name:'Synthetic Staff',role:'Staff',status:'Active',branchId:'b1',permissions:['all']}],staff:[{userId:'u1',personId:'p1',branchId:'b1'}],branches:[{id:'b1',name:'Synthetic branch'}],patients:[],dentists:[],appointments:[],queue:[],treatments:[],invoices:[],prescriptions:[],hmo:[],conversations:[],notifications:[]}
const rows=Array.from({length:120},(_,i)=>({id:'synthetic-'+String(120-i).padStart(3,'0'),title:'Synthetic notification '+(120-i),body:'Synthetic operational update',read:false,created_at:'2026-11-15T08:00:00+08:00'}))
window.historyFixture={requests:[],failMore:false,rows}
window.fetch=async(url,options={})=>{
 const target=new URL(url,location.href),path=target.pathname
 if(path==='/sanctum/csrf-cookie')return new Response(null,{status:204})
 window.historyFixture.requests.push({path,query:target.search})
 const before=target.searchParams.get('before')
 if(before&&window.historyFixture.failMore)return Response.json({message:'Synthetic history unavailable'},{status:503})
 let readId=null
 if(path.endsWith('/read')){readId=path.split('/').at(-2);rows.find(row=>row.id===readId).read=true}
 if(path.endsWith('/read-all'))rows.forEach(row=>{row.read=true})
 const offset=before?rows.findIndex(row=>row.id===before)+1:0,page=rows.slice(offset,offset+50),more=offset+50<rows.length
 return Response.json({data:page,meta:{unread:rows.filter(row=>!row.read).length,has_more:more,next_before:more?page.at(-1).id:null,...(readId?{read_id:readId}:{})}})
}
createRoot(document.getElementById('root')).render(React.createElement(Shell,{role:'staff',page:'dashboard',setPage:()=>{},activeBranch:'Synthetic branch',setActiveBranch:()=>{},store:{state,session,actions:{},toast(){}}},React.createElement('p',null,'Synthetic notification history only')))
</script></body></html>
