<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic QA interaction fixture</title></head><body><main id="root"></main><script type="module">
import React,{useRef,useState} from 'react'
import {createRoot} from 'react-dom/client'
import {PrescriptionsServerPage} from '/src/pages/ServerPrescriptions.jsx'
import {TreatmentPage} from '/src/pages/EncounterWorkspace.jsx'
import {QueueCountsNotice} from '/src/pages/QueueCounts.jsx'
import {RefreshButton} from '/src/components.jsx'
import {clinicalFixture} from '/tests/support/den-ui-02-fixture.js'
import {setClockSource} from '/src/clock.js'
import '/src/styles.css'
import '/src/foundation.css'
import '/src/patient.css'
import '/src/public-site.css'
import '/src/polish.css'
import '/src/patient/portal.css'
import '/src/landing.css'
import '/src/automations.css'
setClockSource(()=>new Date('2026-11-01T10:00:00+08:00'))
const pending=new Map()
window.qa05={reads:[],commands:[],feedback:[],resolve(i,value){pending.get(i)?.resolve(value);pending.delete(i)},reject(i){pending.get(i)?.reject(new Error('Synthetic failure'));pending.delete(i)}}
function Fixture(){
 const [mode,setMode]=useState(new URLSearchParams(location.search).get('mode')||'rx'),[role,setRole]=useState('dentist'),[disabled,setDisabled]=useState(false)
 const [model,setModel]=useState(()=>{const base=clinicalFixture(),links={patientId:'p1',branchId:'b1',dentistId:'d1',appointmentId:null,visitId:'v1'};base.state.visits=[{...links,id:'v1',server:true,status:'In Treatment',clinicDate:'2026-11-01'}];base.state.treatments=[{...links,id:'t1',server:true,author:true,status:'In Treatment',revision:1,complaint:'Synthetic complaint',plan:'Synthetic plan',procedures:[]}];return base})
 const auth=useRef(1),previousRole=useRef(role);if(previousRole.current!==role){auth.current++;previousRole.current=role}
 const getAuthGeneration=useRef(()=>auth.current).current
 const refresh=()=>{const i=window.qa05.reads.length;window.qa05.reads.push({role,patient:model.state.treatments[0].patientId});return new Promise((resolve,reject)=>pending.set(i,{resolve,reject}))}
 const store={...model,session:{...model.session,role},getAuthGeneration,appointmentsStatus:'ready',queueSnapshot:{date:'2026-11-01',truncated:false},toast:(...args)=>window.qa05.feedback.push(args),appointmentFlow:{refresh,saveTreatment:async(record,form,key)=>{window.qa05.commands.push({record,form,key});return{ok:false,kind:'network',uncertain:true,message:'Synthetic unknown save outcome'}},startTreatment(){throw new Error('Unexpected Start')},completeTreatment(){throw new Error('Unexpected Complete')}}}
 Object.assign(window.qa05,{setMode,setRole,setDisabled,invalidateAuth:()=>{auth.current=null},advanceAuth:()=>{auth.current++;setModel(old=>({...old}))},replaceTreatment:patch=>setModel(old=>({...old,state:{...old.state,treatments:old.state.treatments.map(t=>({...t,...patch}))}}))})
 if(mode==='shared')return React.createElement(RefreshButton,{ariaLabel:'Synthetic refresh',title:'Synthetic refresh',disabled,onClick:refresh})
 if(mode==='queue')return React.createElement(QueueCountsNotice,{vis:{mode:'error',message:'Synthetic live queue unavailable'},store})
 if(mode==='encounter')return React.createElement(TreatmentPage,{store,context:{treatmentId:'t1',visitId:'v1',patientId:'p1',branchId:'b1',dentistId:'d1'},setPage:()=>setMode('away')})
 if(mode==='away')return React.createElement('h1',null,'Synthetic destination')
 return React.createElement(PrescriptionsServerPage,{store,role,setPage:()=>{}})
}
createRoot(document.getElementById('root')).render(React.createElement(Fixture))
</script></body></html>
